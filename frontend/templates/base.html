<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatPulse AI</title>
    <style>
        /* Modern Font & Reset */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0a0a0f; /* Deep dark background */
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: rgba(15, 15, 25, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px); /* Glassmorphism */
        }

        .sidebar h2 {
            color: #a855f7; /* Neon Purple */
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h2::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background-color: #a855f7;
            border-radius: 50%;
            box-shadow: 0 0 10px #a855f7; /* Glow effect */
        }

        .sidebar a {
            display: flex;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* Smooth transition */
            border: 1px solid transparent;
        }

        .sidebar a:hover {
            background-color: rgba(168, 85, 247, 0.1);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.2);
            transform: translateX(5px); /* Slide effect on hover */
        }

        /* YEH ACTIVE CLASS HAI JO PURPLE KAREGI */
        .sidebar a.active {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.15) 0%, transparent 100%);
            color: #d8b4fe;
            border-left: 3px solid #a855f7;
            transform: translateX(0); /* Active state par shift nahi hoga */
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        /* Background Gradient Effect */
        .main-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Card Styling */
        .card {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(168, 85, 247, 0.3); /* Border glow on hover */
            transform: translateY(-2px); /* Slight lift */
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        ul {
            list-style: none;
        }

        ul li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        ul li:last-child {
            border-bottom: none;
        }

        /* Status Badges */
        .status-ready {
            color: #10b981; /* Teal/Green */
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-ready::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-error {
            color: #ef4444; /* Red */
            background: rgba(239, 68, 68, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-error::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        /* Pulse Animation */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>ThreatPulse AI</h2>
        <!-- Yahan dynamic active class lagi hai -->
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Overview</a>
        <a href="/readiness" class="{% if request.path == '/readiness' %}active{% endif %}">System Readiness</a>
        <a href="/live-monitor" class="{% if request.path == '/live-monitor' %}active{% endif %}">Live Monitor</a>
        <a href="/performance" class="{% if request.path == '/performance' %}active{% endif %}">Performance Lab</a>
        <a href="/evaluation" class="{% if request.path == '/evaluation' %}active{% endif %}">Evaluation Metrics</a>
        
    </div>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
